
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Turant_Loan_Android_Project.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download files
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o Turant_Loan_Android_Project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Turant-Loan-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
